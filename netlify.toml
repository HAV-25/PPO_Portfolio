[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Ensure devDependencies (e.g. @types/node, typescript) install during the build.
  # Netlify sets NODE_ENV=production at runtime automatically; forcing it at build
  # time skips devDependencies and breaks `next build`'s type-check step.
  NPM_FLAGS = "--include=dev"
